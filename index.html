  </div>
  <script>
    const quoteFrame = document.getElementById('quoteFrame');
    const quoteFrameOrigin = new URL(quoteFrame.src).origin;

    // Real attribution params this page itself was loaded with, e.g.
    // https://example.com/?gclid=abc123&utm_source=google
    const getHostAttributionParams = () => {
      const payload = {};
      new URLSearchParams(window.location.search).forEach((value, key) => {
        payload[key] = value;
      });
      return payload;
    };

    window.addEventListener('message', (event) => {
      if (event.source !== quoteFrame.contentWindow || !event.data) {
        return;
      }

      if (event.data.type === 'quoteFormReady') {
        const payload = getHostAttributionParams();

        if (Object.keys(payload).length === 0) {
          console.log('Quote form ready, but no attribution params on this page to send');
          return;
        }

        console.log('Quote form ready, sending attribution', payload);

        quoteFrame.contentWindow.postMessage(
          { type: 'quoteFormAttribution', payload },
          quoteFrameOrigin
        );
        return;
      }

      if (event.data.type !== 'quoteFormEvent') {
        return;
      }

      console.log('Quote form event received: ', event.data);

      const {event: eventName, data} = event.data;

      switch (eventName) {
        case 'quoteFormSubmitted':
          console.log('Form successful submitted ', data);

          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'quoteFormSubmitted',
            formData: data,
          });
          break;
      }
    })
  </script>
